services:
  anubis_monitor:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis_monitor
    restart: unless-stopped
    environment:
      DIFFICULTY: "5"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://beszel:8090"
      POLICY_FNAME: "/data/cfg/botPolicy.yml"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    networks:
      - proxy_mother
    volumes:
      - "./botPolicy.yml:/data/cfg/botPolicy.yml:ro"

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: https://mon.rajimayur.me
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    networks:
      - proxy_mother

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    volumes:
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /proc:/proc:ro
      - /sys:/sys:ro
    environment:
      LISTEN: ${PORT}
      KEY: ${KEY}
      TOKEN: ${TOKEN}
      HUB_URL: http://beszel:8090
    networks:
      - proxy_mother

volumes:
  anubis-data:

networks:
  proxy_mother:
    external: true
