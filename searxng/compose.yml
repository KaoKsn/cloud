# SEARXNG PUBLIC INSTANCE
services:
  anubis_searxng:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis_searxng
    restart: unless-stopped
    environment:
      DIFFICULTY: "5"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://searxng-core:8000"
      POLICY_FNAME: "/data/cfg/botPolicy.yml"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    networks:
      - proxy_mother
    volumes:
      - "./botPolicy.yml:/data/cfg/botPolicy.yml:ro"
      - "./anubis-data:/data"

  searxng-core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest}
    restart: unless-stopped
    env_file: ./.env
    volumes:
      - ./core-config/:/etc/searxng/:Z
      - ./core-data:/var/cache/searxng/
    # Limit resources, python complains about having just 1 vcpu.
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512MB
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`searx.rajimayur.me`)"
      - "traefik.http.routers.searxng.entrypoints=websecure"
      - "traefik.http.routers.searxng.tls=true"
      - "traefik.http.routers.searxng.tls.certresolver=letsencrypt"
      - "traefik.http.services.searxng.loadbalancer.server.port=8000"
      # Headers Middleware
      - "traefik.http.routers.searxng.middlewares=headers-searxng@docker"
      - "traefik.http.middlewares.headers-searxng.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.headers-searxng.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.headers-searxng.headers.stsPreload=true"
      - "traefik.http.middlewares.headers-searxng.headers.frameDeny=true"
      - "traefik.http.middlewares.headers-searxng.headers.browserXssFilter=true"
      - "traefik.http.middlewares.headers-searxng.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.headers-searxng.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.headers-searxng.headers.featurePolicy=accelerometer 'none'; autoplay 'none'; camera 'none'; encrypted-media 'none'; fullscreen 'self'; geolocation 'none'; gyroscope 'none'; magnetometer 'none'; microphone 'none'; payment 'none'; usb 'none'"
      - "traefik.http.middlewares.headers-searxng.headers.customResponseHeaders.Content-Security-Policy=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; upgrade-insecure-requests;"
    networks:
      - proxy_mother

  searxng-valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    entrypoint: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/
      - "./valkey.conf:/etc/sysctl.conf"
    networks:
      - proxy_mother

volumes:
  valkey-data:

networks:
  proxy_mother:
    external: true
