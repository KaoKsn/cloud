services:
  anubis_profile:
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis_profile
    restart: unless-stopped
    environment:
      DIFFICULTY: "5"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://homepage:5000"
      POLICY_FNAME: "/data/cfg/botPolicy.yml"
      OG_PASSTHROUGH: "true"
      OG_EXPIRY_TIME: "24h"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    networks:
      - proxy_mother
    depends_on:
      - homepage
    volumes:
      - "./botPolicy.yml:/data/cfg/botPolicy.yml:ro"

  homepage:
    image: homepage:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: homepage
    env_file: .env
    environment:
        FLASK_ENV: production
        DATABASE_URL: ${DATABASE_URL}
    restart: unless-stopped
    volumes:
      - "./var/log/flask:/var/log/flask"
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
    depends_on:
      profile_db:
        condition: service_healthy
    networks:
      - proxy_mother

  profile_db:
    image: postgres:18-alpine
    container_name: profile_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U article_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy_mother

volumes:
  anubis-data:

networks:
  proxy_mother:
    external: true
