services:
  revproxy:
    image: nginx:latest
    container_name: nginx_proxy
    labels:
      com.description: "Nginx reverse proxy, listen on 80/443 and proxy pass to containers in the network"
      com.maintainer: "libremaintainer@proton.me"
    ports:
      - "80:80"
      - "443:443"
    restart: always
    networks:
      - mother
    volumes:
      - "./nginx/mime.types:/etc/nginx/mime.types"
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf"
      - "/etc/letsencrypt:/etc/letsencrypt:ro"
      - "./var/log/nginx:/var/log/nginx:rw"

networks:
  mother:
